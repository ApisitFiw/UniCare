<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="unicare-bg" x1="15" y1="10" x2="85" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0c5b4d" />
      <stop offset="45%" stopColor="#08473c" />
      <stop offset="100%" stopColor="#06382f" />
    </linearGradient>

    <radialGradient id="unicare-glow-disc" cx="50" cy="50" r="38" fx="50" fy="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#99f6e4" stopOpacity="0.45" />
      <stop offset="55%" stopColor="#5eead4" stopOpacity="0.25" />
      <stop offset="85%" stopColor="#2dd4bf" stopOpacity="0.1" />
      <stop offset="100%" stopColor="#14b8a6" stopOpacity="0" />
    </radialGradient>

    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="unicare-sprout-color" x1="35" y1="35" x2="65" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#e6fffa" />
      <stop offset="30%" stopColor="#bbf7d0" />
      <stop offset="100%" stopColor="#86efac" />
    </linearGradient>

    <filter id="sprout-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" floodColor="#03261f" floodOpacity="0.35" />
    </filter>
  </defs>

  <circle cx="50" cy="50" r="50" fill="url(#unicare-bg)" />
  <circle cx="50" cy="50" r="35" fill="url(#unicare-glow-disc)" />
  <circle cx="50" cy="50" r="34" stroke="#99f6e4" strokeOpacity="0.4" strokeWidth="1.75" filter="url(#glow-blur)" />

  <g filter="url(#sprout-shadow)">
    <rect x="47" y="48" width="6" height="22" rx="3" fill="url(#unicare-sprout-color)" />
    <path d="M48.5 54 C35 55 30 46 33.5 39 C38.5 36 51 43 48.5 54 Z" fill="url(#unicare-sprout-color)" />
    <path d="M51.5 51 C54 40.5 63.5 36.5 68.5 40.5 C70 48.5 58 56 51.5 51 Z" fill="url(#unicare-sprout-color)" />
  </g>
</svg>
